<!doctype html>
<html lang="zh-CN" data-theme="graphite-purple">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242633" />
    <style id="graphite-purple-first-paint">
      html[data-theme="graphite-purple"] { --green:#7654bb; --green-soft:#f0eaf9; --accent:#7654bb; --accent-bright:#9170cb; --page-bg:#f6f6f8; --surface:#fff; --ink:#252334; --muted:#716b7f; --line:#e1dce9; }
      html[data-theme="graphite-purple"] body { background:#f6f6f8; color:#252334; }
      html[data-theme="graphite-purple"] .project-sidebar { background:#242633 !important; color:#f1eef7; border-color:#3c3b4b; }
      html[data-theme="graphite-purple"] .project-sidebar .sidebar-back { background:#30313f; color:#f1eef7; border-color:#575268; }
      html[data-theme="graphite-purple"] .project-sidebar .sidebar-current-project strong { color:#f1eef7; }
    </style>
    <script>
      try {
        const saved=localStorage.getItem('trash-theme');
        const theme=['graphite-purple','default','blue'].includes(saved)?saved:'graphite-purple';
        document.documentElement.dataset.theme=theme;
        document.querySelector('meta[name="theme-color"]').content={'graphite-purple':'#242633',default:'#f4f6f5',blue:'#f3f7fc'}[theme];
      } catch { /* The static document already uses the default theme. */ }
    </script>
    <title>trash | 科研工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
